name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Installa dipendenze
        run: uv sync --frozen
      - name: Test
        run: uv run pytest -q
      - name: Verifica indice
        run: uv run python index/build_index.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installa dipendenze
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
